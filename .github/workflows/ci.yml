name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-json:
    name: Workflow JSON checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/check_workflows.sh

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Pinned image instead of gitleaks-action: same binary locally and in CI, no licence key.
      - name: gitleaks (full history)
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh zricethezav/gitleaks:v8.30.1 -c \
            'git config --global --add safe.directory /repo && gitleaks git /repo --redact --verbose'

  python:
    name: ruff + pytest
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  smoke:
    name: Stack and ingestion pipeline (mock model)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: cp .env.example .env
      - run: docker compose up -d --wait --wait-timeout 300
      - name: Migrations applied
        run: |
          docker compose exec -T postgres psql -U postgres -d ops -tAc \
            "SELECT version FROM schema_migrations ORDER BY version" | tee applied.txt
          expected=$(for f in db/migrations/*.sql; do basename "$f" .sql; done)
          diff <(echo "$expected") applied.txt
      - name: Migrations are idempotent
        run: docker compose run --rm migrate | tee rerun.txt && grep -q "done, 0 applied" rerun.txt
      - name: invoice_key_of() in Postgres matches data-gen's invoice_key()
        run: |
          # Same vector as test_invoice_key_known_vector in data-gen/tests/test_primitives.py
          got=$(docker compose exec -T postgres psql -U postgres -d ops -tAc "SELECT invoice_key_of('51824753556', ' inv-1 ', 100)")
          [ "$got" = "5724b35020e9eb048d47c1583989c74ee868d18306f42c34a480d685608eb344" ]
      - name: Ingestion functions (db/tests)
        run: bash scripts/test-db.sh
      - name: Seed master data (twice; second load must change nothing)
        run: |
          python data-gen/generate.py --n 200 --seed 42 > /dev/null
          bash scripts/seed.sh | tee seeded.txt
          bash scripts/seed.sh | diff seeded.txt -
          python - <<'EOF'
          import json
          m = json.load(open("data-gen/out/master_data.json"))
          expected = {
              "suppliers": len(m["suppliers"]),
              "purchase_orders": len(m["purchase_orders"]),
              "purchase_order_lines": sum(len(po["lines"]) for po in m["purchase_orders"]),
              "receipts": len(m["receipts"]),
              "receipt_lines": sum(len(r["lines"]) for r in m["receipts"]),
          }
          seeded = {k: int(v) for k, v in (line.split() for line in open("seeded.txt") if line.strip())}
          assert seeded == expected, (seeded, expected)
          print("seeded counts match master_data.json")
          EOF
      - name: Credentials (Ollama pointed at the mock model)
        run: OLLAMA_BASE_URL=http://host.docker.internal:11500 bash scripts/setup-credentials.sh
      - name: Import and publish workflows
        run: bash scripts/import.sh
      - name: Import is idempotent and complete
        run: |
          bash scripts/import.sh
          imported=$(docker compose exec -T n8n n8n list:workflow | grep -c '|' || true)
          files=$(printf '%s\n' workflows/*.json | wc -l)
          echo "imported=$imported files=$files"
          [ "$imported" -eq "$files" ]
      - name: Start the mock model
        run: |
          python evals/mock_ollama.py --data data-gen/out --port 11500 > mock.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:11500/api/version && break; sleep 1; done
      - name: Pipeline behaviour (retry, needs_review, outage, bad uploads, idempotency)
        run: |
          set -a; . ./.env; set +a
          python evals/pipeline_check.py
      - name: Ingest the dataset through the webhook (mock model, pipeline test only)
        run: |
          set -a; . ./.env; set +a
          bash scripts/reset-ingestion.sh
          curl -sf -X POST http://127.0.0.1:11500/__mode -d '{"mode":"oracle"}'
          python evals/run.py --suite extraction --target n8n --mock --limit 100 --out "$RUNNER_TEMP/eval"
      - name: Reconciliation, rules only (ground-truth extraction and line matches, SQL only; must be perfect)
        run: |
          bash scripts/reset-ingestion.sh
          python evals/run.py --suite reconciliation --expect-perfect --out "$RUNNER_TEMP/eval"
      - name: Reconciliation through n8n, line matching by the mock model (pipeline test only)
        run: |
          set -a; . ./.env; set +a
          bash scripts/reset-ingestion.sh
          curl -sf -X POST http://127.0.0.1:11500/__mode -d '{"mode":"oracle"}'
          python evals/run.py --suite reconciliation --source truth --matcher n8n --mock --expect-perfect --out "$RUNNER_TEMP/eval"
      - name: Reconciliation end to end from the PDFs (mock model, pipeline test only)
        run: |
          set -a; . ./.env; set +a
          bash scripts/reset-ingestion.sh
          python evals/run.py --suite reconciliation --source pdf --mock --expect-perfect --out "$RUNNER_TEMP/eval"
      - name: Export round-trip leaves workflows/ unchanged
        run: |
          bash scripts/export.sh
          git status --porcelain workflows/
          git diff --exit-code workflows/
          [ -z "$(git status --porcelain workflows/)" ]
      - if: failure()
        run: |
          docker compose logs --no-color
          cat mock.log || true
      - if: always()
        run: docker compose down -v
