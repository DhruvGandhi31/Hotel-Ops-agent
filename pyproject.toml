# Tooling config for data-gen/ and evals/ (run outside n8n).
[project]
name = "hotel-ops-agent"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
addopts = "-ra"
