# Tooling config for data-gen/ and evals/ (run outside n8n).
[project]
name = "hotel-ops-agent"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["data-gen", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"data-gen/hotel_datagen/catalog.py" = ["E501"]  # one price-list row per line

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["data-gen", "evals"]
testpaths = ["data-gen/tests", "evals/tests"]
