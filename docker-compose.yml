name: hotel-ops-agent

# All host ports bind to 127.0.0.1 only. Nothing here is meant to be internet-facing.

services:
  postgres:
    image: postgres:17.11-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: postgres
      # Consumed by db/init/01_create_databases.sh on first start only.
      N8N_DB_USER: ${N8N_DB_USER:?set in .env}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?set in .env}
      OPS_DB_USER: ${OPS_DB_USER:?set in .env}
      OPS_DB_PASSWORD: ${OPS_DB_PASSWORD:?set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      # TCP check on purpose: during first-time init Postgres only listens on the
      # unix socket, so this stays unhealthy until init scripts have finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 30

  # One-shot: applies db/migrations/*.sql to the ops database, then exits.
  migrate:
    image: postgres:17.11-alpine3.23
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ops
      PGUSER: ${OPS_DB_USER}
      PGPASSWORD: ${OPS_DB_PASSWORD}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ./db/migrations:/migrations:ro
      - ./scripts/migrate.sh:/usr/local/bin/migrate.sh:ro
    entrypoint: ["sh", "/usr/local/bin/migrate.sh"]

  # PDF text extraction. The same pypdf code the eval harness uses, so the model sees the same text
  # in evals and in production (n8n's Extract From File space-joins table cells and costs ~9 points
  # of line-item accuracy). Not published to the host; only n8n reaches it.
  pdf-text:
    build: ./services/pdf-text
    image: hotel-ops-agent/pdf-text:1
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  n8n:
    image: n8nio/n8n:2.41.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      pdf-text:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: ${N8N_DB_USER}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set in .env}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      GENERIC_TIMEZONE: ${TZ:-Australia/Sydney}
      TZ: ${TZ:-Australia/Sydney}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_MCP_ACCESS_ENABLED: ${N8N_MCP_ACCESS_ENABLED:-false}
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: ${EXECUTIONS_DATA_MAX_AGE:-336}
      # Code nodes may use exactly these built-in modules and no external ones: crypto hashes
      # uploads, fs reads the mounted prompt and schema files.
      NODE_FUNCTION_ALLOW_BUILTIN: crypto,fs
    volumes:
      - n8n_data:/home/node/.n8n
      # Single source of truth for prompts and schemas: the eval harness and the workflow read these files.
      - ./prompts:/opt/hotel-ops/prompts:ro
      - ./schemas:/opt/hotel-ops/schemas:ro
    extra_hosts:
      # Reach Ollama running on the Docker host. Built in on Docker Desktop; needed on Linux (CI).
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  ollama:
    image: ollama/ollama:0.35.0
    profiles: ["local-llm"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      # 11435 on the host so it doesn't clash with a natively installed Ollama.
      # From n8n, use http://ollama:11434.
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11435}:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  postgres_data:
  n8n_data:
  ollama_data:
